name: sandbox_runtime
description: >-
  Dart port of Anthropic Sandbox Runtime (srt): filesystem and network
  restrictions for arbitrary processes, via sandbox-exec on macOS, bubblewrap
  on Linux, and srt-win on Windows.
version: 0.0.79
repository: https://github.com/Telosnex/sandbox-runtime-dart
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.6.0
  crypto: ^3.0.6
  ffi: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
